worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    log_format safe '$remote_addr $request_method $uri $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;
    client_body_timeout 30s;
    send_timeout 60s;

    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream foxtube_api {
        zone foxtube_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-FoxTube-Client-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_hide_header Server;

        location /internal-media/ {
            internal;
            alias /srv/foxtube/media/;
            disable_symlinks on;
            limit_except GET { deny all; }
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /api/v1/auth/ {
            client_max_body_size 16k;
            proxy_pass http://foxtube_api;
        }

        location ~ ^/api/v1/videos/[0-9a-fA-F-]+/source$ {
            client_max_body_size 500m;
            proxy_request_buffering off;
            proxy_pass http://foxtube_api;
        }

        location /api/v1/videos {
            client_max_body_size 16k;
            proxy_pass http://foxtube_api;
        }

        location / {
            proxy_pass http://foxtube_api;
        }
    }
}
