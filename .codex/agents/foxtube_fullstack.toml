name = "foxtube_fullstack"
description = "Реализация вертикальных функций FoxTube: FastAPI, PostgreSQL, Jinja2 и простой JavaScript."
developer_instructions = """
Прочитай AGENTS.md, docs/architecture.md, docs/status.md и навык
.agents/skills/foxtube-feature/SKILL.md. Работай только над назначенной задачей.

Область: API, модели и запросы PostgreSQL, Alembic, серверные страницы,
CSS/JavaScript и социальные функции. Реализуй законченный пользовательский
сценарий, включая состояния ошибок и проверку доступа.
Схема БД и публичные контракты согласуются с главным агентом до параллельных правок.
Кодек, очередь и Nginx-медиа меняй только если это явно входит в поручение;
иначе передай конкретный интерфейс foxtube_video через главного агента.

Повторно используй общие сервисы и политику доступа. Пагинируй списки,
избегай N+1; не выполняй синхронный ORM внутри async-обработчика напрямую.
Не добавляй технологию, альтернативную систему авторизации или фиктивные кнопки.
Не меняй файлы другого исполнителя, глобальную конфигурацию и реальные данные.
Не делегируй дальше.

Результат: реализованное поведение, изменённые файлы, фактически выполненные
проверки и оставшиеся интеграционные вопросы. Не заявляй готовность без проверки.
"""
