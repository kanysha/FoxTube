{% macro field_icon(kind) -%}
<svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true">
  {% if kind == 'email' %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/>
  {% elif kind == 'person' %}<circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
  {% else %}<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>{% endif %}
</svg>
{%- endmacro %}

{% macro password_toggle(input_id) -%}
<button class="password-toggle" type="button" data-password-toggle aria-controls="{{ input_id }}" aria-label="Показать пароль" aria-pressed="false" title="Показать пароль" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg>
</button>
{%- endmacro %}

{% macro auth_art() -%}
<div class="auth-art" aria-hidden="true">
  <img src="/static/auth-scene.svg" width="440" height="280" alt="">
  <div class="auth-art-caption"><span class="auth-art-dot"></span>Смотрите. Делитесь. Вдохновляйтесь.</div>
</div>
{%- endmacro %}
