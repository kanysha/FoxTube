  <style>
  .ft-logo { transform-origin: 120px 120px; }
  .ft-wink { transform-box: fill-box; transform-origin: center; }
  .ft-fox { transform-box: fill-box; transform-origin: 48% 62%; }
  @keyframes ft-wink { 0%, 68%, 77%, 100% { transform: scaleY(1); } 72%, 73% { transform: scaleY(.12); } }
  @keyframes ft-look { 0%, 100% { transform: rotate(0deg); } 45% { transform: translateY(-4px) rotate(-.8deg); } }
  @media (prefers-reduced-motion: reduce) { svg * { animation: none !important; } }
  svg[data-motion="off"] * { animation: none !important; }

  .ft-orbit-line { stroke: #ff3529; stroke-width: 2.6; stroke-linecap: round; animation: ft-orbit 2.4s linear infinite; }
  .ft-orbit-dot { stroke-width: 5; }
  .ft-wink { animation: ft-wink 2.4s ease-in-out infinite; }
  .ft-fox { animation: ft-look 2.4s ease-in-out infinite; }
  @keyframes ft-orbit { from { stroke-dashoffset: var(--ft-tail-offset, 0px); } to { stroke-dashoffset: calc(var(--ft-tail-offset, 0px) - 100px); } }
</style>

